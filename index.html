<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>

<!DOCTYPE html>
<html lang='id'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Simulasi Model Komunikasi</title>
  <link rel='stylesheet' href='style.css'>
  <script defer src='script.js'></script>
</head>
<body>
  <div class='container'>
    <h1>🚀 Simulasi Sistem Terdistribusi</h1>
    <p>Perbandingan Request-Response, Publish-Subscribe, dan RPC</p>

    <div class='buttons'>
      <button onclick='requestResponse()'>Request-Response</button>
      <button onclick='publishSubscribe()'>Publish-Subscribe</button>
      <button onclick='rpc()'>RPC</button>
      <button onclick='resetSim()'>Reset</button>
    </div>

    <div class='network'>
      <div id='client' class='node blue'>Client</div>
      <div id='server' class='node red'>Server</div>
      <div id='broker' class='node green'>Broker</div>
      <div id='sub1' class='node yellow'>Sub A</div>
      <div id='sub2' class='node yellow'>Sub B</div>
      <div id='arena'></div>
    </div>

    <div class='panels'>
      <div class='panel'><h2>📜 Log</h2><pre id='log'></pre></div>
      <div class='panel'><h2>📊 Metrics</h2><div id='metrics'></div></div>
    </div>
  </div>
</body>
</html>
